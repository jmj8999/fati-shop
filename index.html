<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>فروشگاه لوکس من</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: "Vazirmatn", sans-serif;
      }
    </style>
  </head>

  <body class="bg-[#0F0F0F] text-gray-200">
    <header
      class="flex justify-between items-center px-6 py-4 bg-[#1A1A1A] shadow-lg"
    >
      <h1 class="text-2xl font-bold text-purple-500">🛍️ LuxShop</h1>
      <nav class="space-x-6 space-x-reverse">
        <a href="#" class="hover:text-purple-400">خانه</a>
        <a href="#" class="hover:text-purple-400">محصولات</a>
        <a href="#" class="hover:text-purple-400">درباره ما</a>
        <a href="#" class="hover:text-purple-400">تماس</a>
      </nav>
      <button
        class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-xl transition"
      >
        ورود / ثبت‌نام
      </button>
    </header>

<div id="productList" class="products"></div>
    <section
      class="text-center py-24 bg-gradient-to-b from-[#1A1A1A] to-[#0F0F0F]"
    >
      <h2 class="text-4xl font-extrabold text-purple-400 mb-4">
        خوش‌اومدی به فروشگاه لوکس من
      </h2>
      <p class="text-gray-400 mb-8">کیفیت بالا، طراحی خاص، تجربه متفاوت خرید</p>
      <button
        class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-xl transition"
      >
        مشاهده محصولات
      </button>
    </section>

    <section class="px-6 py-12">
      <h3 class="text-2xl font-semibold text-purple-400 mb-6 text-center">
        محصولات منتخب
      </h3>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
        <div
          class="bg-[#1A1A1A] p-4 rounded-2xl shadow-lg hover:shadow-purple-500/30 transition"
        >
          <img
            src="https://via.placeholder.com/300x200"
            alt="محصول"
            class="rounded-xl mb-4"
          />
          <h4 class="text-lg font-semibold mb-2">محصول شماره ۱</h4>
          <p class="text-gray-400 mb-4">توضیح کوتاه محصول</p>
          <button
            class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2 rounded-xl"
          >
            افزودن به سبد
          </button>
        </div>

        <div
          class="bg-[#1A1A1A] p-4 rounded-2xl shadow-lg hover:shadow-purple-500/30 transition"
        >
          <img
            src="https://via.placeholder.com/300x200"
            alt="محصول"
            class="rounded-xl mb-4"
          />
          <h4 class="text-lg font-semibold mb-2">محصول شماره ۲</h4>
          <p class="text-gray-400 mb-4">توضیح کوتاه محصول</p>
          <button
            class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2 rounded-xl"
          >
            افزودن به سبد
          </button>
        </div>

        <div
          class="bg-[#1A1A1A] p-4 rounded-2xl shadow-lg hover:shadow-purple-500/30 transition"
        >
          <img
            src="https://via.placeholder.com/300x200"
            alt="محصول"
            class="rounded-xl mb-4"
          />
          <h4 class="text-lg font-semibold mb-2">محصول شماره ۳</h4>
          <p class="text-gray-400 mb-4">توضیح کوتاه محصول</p>
          <button
            class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2 rounded-xl"
          >
            افزودن به سبد
          </button>
        </div>
      </div>
    </section>

    <footer class="bg-[#1A1A1A] text-center py-6 mt-10">
      <p class="text-gray-500">© 2025 فروشگاه لوکس من - همه حقوق محفوظ است</p>
    </footer>
    <script src="script.js"></script>
  </body>
  <script>
document.addEventListener("DOMContentLoaded", () => {
  try {
    const products = JSON.parse(localStorage.getItem("products")) || [];
    const container = document.querySelector(".grid");

    if (!container) {
      console.error("عنصر .grid پیدا نشد");
      return;
    }

    container.innerHTML = products
      .map((p) => {
        const name = p.name || "بدون نام";
        const price = p.price || "0";
        const image = p.image || "";
        const desc = p.desc || "";

        return 
          <div class="bg-white rounded-lg shadow p-4">
            <img src="${image}" alt="${name}" class="w-full rounded" onerror="this.style.display='none'"/>
            <h3 class="text-lg font-bold mt-2">${name}</h3>
            <p class="text-purple-600 font-semibold">${price} تومان</p>
            <p class="text-gray-500 text-sm mt-1">${desc}</p>
            <button class="w-full bg-purple-600 hover:bg-purple-700 text-white mt-3 py-2 rounded">
              افزودن به سبد
            </button>
          </div>
        ;
      })
      .join("");
  } catch (err) {
    console.error("خطا:", err);
  }
});
</script>
</body>
</html>
